#
# SysGF all-features integration test.
#
# Purpose: exercise every SysGF district-heating feature in one myopic run and
# quantify the system impact of thermal storage. This is the first setup that
# activates all heat sources (air/ground, river, lake and sea water, geothermal
# and all six PtX waste-heat streams) together with all three TES technologies
# (TTES, PTES, ATES) on an explicit district-heating representation.
#
# Tier 2 of the test: same setup as config.sysgf_allfeatures.yaml but at 24H
# (365 snapshots per year), which resolves seasonal storage cycling and is the
# configuration the TES impact numbers are read from. DE is clustered to 4
# nodes instead of the production 8 (see clustering.focus_weights).
#
# Scenario matrix (config/scenarios.sysgf_allfeatures.yaml):
#   TESoff  -- TTES, PTES and ATES all disabled
#   TESon   -- TTES, PTES and ATES all enabled
# One variable differs between them: the availability of thermal storage.

run:
  prefix: 20260803_allfeatures_24H
  name:
  - TESoff
  - TESon
  scenarios:
    enable: true
    manual_file: config/scenarios.sysgf_allfeatures.yaml
    file: config/scenarios.automated.sysgf_allfeatures.yaml
  shared_resources:
    policy: base
    exclude:
    - existing_heating.csv
    - costs
    - retrieve_cost
    - industry_sector_ratios
    - build_industry_sector_ratios
    - modify_existing_heating

foresight: myopic

scenario:
  ll:
  - vopt
  clusters:
  - 23
  opts:
  - ''
  sector_opts:
  - none
  planning_horizons:
  - 2030
  - 2045

# Halved German resolution for the test: 4 DE nodes instead of the production
# 8. The 15-country topology contains 20 country/subnetwork groups, so it needs
# at least 20 clusters; assigning one to each non-German group plus 4 to DE
# gives 23 clusters. Six-decimal weights sum to 0.999995 and reproduce that
# exact integer allocation.
clustering:
  focus_weights:
    'DE': 0.173913
    'AT': 0.043478
    'BE': 0.043478
    'CH': 0.043478
    'CZ': 0.043478
    'DK': 0.086956
    'FR': 0.086956
    'GB': 0.086956
    'LU': 0.043478
    'NL': 0.043478
    'NO': 0.043478
    'PL': 0.043478
    'SE': 0.043478
    'ES': 0.086956
    'IT': 0.086956
  temporal:
    resolution_sector: 24H

# Match the tier-1 HPC safeguard: limit each atlite job to four spawn workers
# so concurrent availability calculations do not overwhelm BeeGFS metadata.
atlite:
  nprocesses: 4

co2_budget:
  2030: 0.35
  2045: 0.00

electricity:
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, hydro]

wasserstoff_kernnetz:
  enable: false

fix_foreign_investments:
  enable: false
  reference_scenario: null

sector:
  chp:
    enable: true
  # All three thermal storage technologies; the scenario file switches them
  # on and off together.
  ttes: true
  tes_tau:
    decentral: 3
    central: 180
  district_heating:
    potential:
      DE: 0.5
      default: 0.5
    progress:
      2030: 0.5
      2045: 1.0
    # Explicit DH systems from the European dh_areas dataset: the smallest set
    # of German systems that covers 50 % of the model's German urban-central
    # heat demand.
    subnodes:
      enable: true
      demand_share: 0.5
      countries: ['DE']
      n_subnodes: 40
      demand_column: Dem_GWh
      label_column: Label
      use_isi_data_assumptions: false
      census_areas:
        enable: false
    # Geothermal potentials are not available for every clustered region at
    # this resolution.
    ignore_missing_geothermal_data: true
    heat_pump_cooling_iterative: false
    ptes:
      enable: true
      dynamic_capacity: false
      discharge_resistive_boosting: false
      temperature_dependent_capacity: false
      top_temperature: 90
      bottom_temperature: 35
      design_top_temperature: 90
      design_bottom_temperature: 35
      potential_limit:
        enable: true
        explicit_subnodes: true
        remaining_regions: true
        osm_landcover_codes: [21, 23, 32, 33]
        excluder_resolution: 10
        min_area: 10000
        default_capacity_mwh: 4500
        natura: true
        groundwater_depth: true
        max_groundwater_depth: -10
    ates:
      enable: true
      # Public BGR aquifer model; the licensed HI grid is not research input.
      data_source: bgr
      data_file: null
      ignore_missing_regions: true
  heat_sources:
    urban central:
    - air
    - ptes
    - ates
    - geothermal
    - river_water
    - lake_water
    - sea_water
    - electrolysis_waste
    - fuel_cell_waste
    - fischer_tropsch_waste
    - haber_bosch_waste
    - sabatier_waste
    - methanolisation_waste
    urban decentral:
    - air
    rural:
    - air
    - ground

solving:
  constraints:
    CCL: false
    EQ: false
    BAU: false
    SAFE: false
    efuel_export_ban: false
    limits_capacity_max: {}
    limits_capacity_min: {}
    limits_volume_max: {}
    limits_volume_min: {}
    limits_power_max: {}
