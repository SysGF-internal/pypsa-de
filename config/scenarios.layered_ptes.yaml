# Layered-PTES capex sweep. Three district-heating forward-temperature regimes
# x {no PTES, PTES at four store-capex levels}. The 95-clip regime additionally
# runs the simple energy-only PTES model.
#
# Forward-T regimes: per-country baseyear values are kept heterogeneous; only the
# annual reduction toward the 2050 horizon is tuned so GERMANY's max forward T
# (baseyear 109 C) reaches the target by 2050 (other countries scale by the same
# rate and end up higher/lower). r solves 109 * (1-r)^(2050-2023) = target:
#   target 95 -> r = 0.00508;  target 80 -> r = 0.01139.
# The clip regime keeps r for 95 and lower-clips the forward curve at 90 C via
# clip_forward_temperature.
#
# Layer temperatures (top = min(DE max forward T, 90); bottom = 10 C; middle at
# the reduced 2050 DE return T = 58 * target/109; 2nd/4th at the midpoints):
#   95 -> [90, 70.3, 50.5, 30.3, 10];  80 -> [80, 61.3, 42.6, 26.3, 10].
#
# Capex: a multiplicative factor on the store capital_cost relative to the DEA
# `central water pit storage` cost (1.135 EUR/kWh = 72.6 EUR/m3 overnight at the
# DEA dT 90-35). factor = (target EUR/m3) / 72.6 -> 50/25/10/5 EUR/m3 =
# 0.689/0.345/0.138/0.0689. NB the pit now spans to 10 C (dT 80), so this is the
# cost at the DEA dT-90-35 reference, not the physical EUR/m3 at the actual dT.

# ============================================================ DE max fwd ~ 95 C
T95_noptes:
  sector:
    district_heating:
      supply_temperature_approximation: &temp_T95
        relative_annual_temperature_reduction: 0.00508
      ptes:
        enable: false

T95_ptes_capex50:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T95
      ptes: &ptes_T95
        enable: true
        layered:
          enable: true
          layer_temperatures: [90, 70.3, 50.5, 30.3, 10]
  adjustments: &cap50
    sector:
      factor:
        Store:
          urban central water pits:
            capital_cost: 0.689

T95_ptes_capex25:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T95
      ptes: *ptes_T95
  adjustments: &cap25
    sector:
      factor:
        Store:
          urban central water pits:
            capital_cost: 0.345

T95_ptes_capex10:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T95
      ptes: *ptes_T95
  adjustments: &cap10
    sector:
      factor:
        Store:
          urban central water pits:
            capital_cost: 0.138

T95_ptes_capex5:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T95
      ptes: *ptes_T95
  adjustments: &cap5
    sector:
      factor:
        Store:
          urban central water pits:
            capital_cost: 0.0689

# ============================================================ DE max fwd ~ 80 C
T80_noptes:
  sector:
    district_heating:
      supply_temperature_approximation: &temp_T80
        relative_annual_temperature_reduction: 0.01139
      ptes:
        enable: false

T80_ptes_capex50:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T80
      ptes: &ptes_T80
        enable: true
        top_temperature: 80
        layered:
          enable: true
          layer_temperatures: [80, 61.3, 42.6, 26.3, 10]
  adjustments: *cap50

T80_ptes_capex25:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T80
      ptes: *ptes_T80
  adjustments: *cap25

T80_ptes_capex10:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T80
      ptes: *ptes_T80
  adjustments: *cap10

T80_ptes_capex5:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_T80
      ptes: *ptes_T80
  adjustments: *cap5

# =============================================== DE max fwd ~ 95 C, clipped 90 C
T95clip90_noptes:
  sector:
    district_heating:
      supply_temperature_approximation: &temp_clip
        relative_annual_temperature_reduction: 0.00508
        clip_forward_temperature: 90
      ptes:
        enable: false

T95clip90_ptes_capex50:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: &ptes_clip_layered
        enable: true
        layered:
          enable: true
          layer_temperatures: [90, 70.3, 50.5, 30.3, 10]
  adjustments: *cap50

T95clip90_ptes_capex25:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_layered
  adjustments: *cap25

T95clip90_ptes_capex10:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_layered
  adjustments: *cap10

T95clip90_ptes_capex5:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_layered
  adjustments: *cap5

T95clip90_simple_capex50:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: &ptes_clip_simple
        enable: true
        layered:
          enable: false
          layer_temperatures: [90]
  adjustments: *cap50

T95clip90_simple_capex25:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_simple
  adjustments: *cap25

T95clip90_simple_capex10:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_simple
  adjustments: *cap10

T95clip90_simple_capex5:
  sector:
    district_heating:
      supply_temperature_approximation: *temp_clip
      ptes: *ptes_clip_simple
  adjustments: *cap5
