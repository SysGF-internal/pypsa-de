#
# Scenario matrix for SysGF / PTES analysis on the dev_caspar branch.
#
# History:
#   This file was originally ported from the paper branch (`paper1`) and used
#   paper-specific PTES knobs that the current branch's PTES code path does
#   NOT consume:
#
#     sector.district_heating.ptes.booster_technologies   -> NOT consumed here
#     sector.district_heating.ptes.discharger_temperature_boosting_required -> NOT consumed
#     sector.district_heating.ptes.min_bottom_temperature -> only consumed under `ates`
#     sector.district_heating.ptes.max_top_temperature    -> only consumed under `ates`
#     sector.district_heating.ptes.scale_capacity         -> not a PTES key on this branch
#
#   The current branch's PTES interface (see `rules/build_sector.smk`,
#   `scripts/build_ptes_operations/run.py`,
#   `scripts/build_ptes_operations/ptes_temperature_approximator.py`,
#   `scripts/prepare_sector_network.py`, `scripts/definitions/heat_source.py`)
#   uses these keys instead:
#
#     sector.district_heating.ptes.top_temperature           (float | "forward")
#     sector.district_heating.ptes.bottom_temperature        (float | "return")
#     sector.district_heating.ptes.design_top_temperature    (float, for capacity scaling)
#     sector.district_heating.ptes.design_bottom_temperature (float, for capacity scaling)
#     sector.district_heating.ptes.discharge_resistive_boosting (bool)
#     sector.district_heating.ptes.temperature_dependent_capacity (bool)
#
#   Discharge-side boosting on this branch:
#     - Resistive booster: set `discharge_resistive_boosting: true`. A resistive
#       heater link is built; the PTES heat pump is *not* built (regardless of
#       `heat_pump_sources`, see `HeatSource.requires_heat_pump`).
#     - Heat-pump booster: set `discharge_resistive_boosting: false` AND keep
#       "ptes" in `sector.heat_pump_sources.urban central`. A PTES-source heat
#       pump is built and used for the temperature lift.
#     - No booster: set `discharge_resistive_boosting: false` AND override
#       `sector.heat_pump_sources.urban central` to a list without "ptes".
#       (Use this when PTES discharges directly without temperature boosting.)
#
#   "freeboost" semantics (paper: `discharger_temperature_boosting_required: false`)
#   are translated to `top_temperature: "forward"` so the PTES top layer
#   dynamically tracks the district-heating forward temperature (clipped to
#   `design_top_temperature`) and `boost_per_discharge == 0` everywhere — i.e.
#   no temperature boost is ever required.
#
#   "freecap" scenarios (paper: `scale_capacity: false`) are equivalent to the
#   current-branch default `temperature_dependent_capacity: false` and would
#   produce identical configurations to their `rhboost` siblings. They have
#   been dropped here. To re-introduce a "scaled capacity" distinction, set
#   `temperature_dependent_capacity: true` (and define design_top/bottom_temperature
#   away from operational top/bottom_temperature) on a per-scenario basis.
#
#   "hpboost" scenarios (HP-based PTES booster) rely on `"ptes"` already being
#   present in `sector.heat_pump_sources.urban central` in
#   `config/config.sysgf.yaml`. They do NOT override the list explicitly.
#
#   "noboost" / "freeboost" scenarios (no PTES heat pump) override
#   `sector.heat_pump_sources.urban central` to the YAML anchor
#   `&hps_without_ptes`, which is defined inline in the first scenario that
#   uses it (MidSupplyTemperature_MidDH_noboost). Keep that list in sync with
#   the corresponding list in `config/config.sysgf.yaml` (minus "ptes").

# ============================================================================
# Mid Supply Temperature scenarios with Mid DH (0.4)
# ============================================================================

# init: build reference solution with PTES disabled (e_nom_max = 0).
NoPTES_MidSupplyTemperature_MidDH_init:
  fix_foreign_investments:
    enable: false
  sector:
    district_heating:
      potential:
        DE: 0.4
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      absolute:
        Store:
          urban central water pits:
            e_nom_max: 0
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05
  solving:
    options:
      skip_iterations: false

# Foreign-grid fixed against the init run; PTES still disabled.
NoPTES_MidSupplyTemperature_MidDH:
  fix_foreign_investments:
    enable: true
    lines_only: true
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH_init
  sector:
    district_heating:
      potential:
        DE: 0.4
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      absolute:
        Store:
          urban central water pits:
            e_nom_max: 0
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05
  solving:
    options:
      skip_iterations: true

# noboost: PTES present but no booster path (no resistive, no PTES heat pump).
MidSupplyTemperature_MidDH_noboost:
  fix_foreign_investments:
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  sector:
    heat_pump_sources:
      # Anchor: keep this list in sync with `sector.heat_pump_sources.urban central`
      # in config/config.sysgf.yaml (with "ptes" removed).
      urban central: &hps_without_ptes
      - air
      - geothermal
      - river_water
      - sea_water
      - electrolysis_waste
      - fuel_cell_waste
      - fischer_tropsch_waste
      - haber_bosch_waste
      - sabatier_waste
      - methanolisation_waste
    district_heating:
      potential:
        DE: 0.4
      ptes:
        discharge_resistive_boosting: false
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05

# hpboost_nocooling: PTES heat-pump booster, dynamic bottom temperature
# (paper: booster_technologies=["ptes"], min_bottom_temperature="return_T").
MidSupplyTemperature_MidDH_hpboost_nocooling:
  fix_foreign_investments:
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  sector:
    district_heating:
      potential:
        DE: 0.4
      ptes:
        discharge_resistive_boosting: false
        bottom_temperature: "return"
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05

# rhboost: resistive-heater booster (paper: booster_technologies=["resistive heater"]).
MidSupplyTemperature_MidDH_rhboost:
  fix_foreign_investments:
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  sector:
    district_heating:
      potential:
        DE: 0.4
      ptes:
        discharge_resistive_boosting: true
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05

# hpboost_10Cbottom: PTES heat-pump booster, fixed bottom temp 10 C
# (paper: booster_technologies=["ptes"], min_bottom_temperature=10).
MidSupplyTemperature_MidDH_hpboost_10Cbottom:
  fix_foreign_investments:
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  sector:
    district_heating:
      potential:
        DE: 0.4
      ptes:
        discharge_resistive_boosting: false
        bottom_temperature: 10
        design_bottom_temperature: 10
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05

# freeboost: PTES top tracks forward T -> boost_per_discharge == 0 always
# (paper: discharger_temperature_boosting_required=false + booster_technologies=["resistive heater"];
#  on this branch the resistive booster would be built but never engaged, so
#  we omit it for clarity).
MidSupplyTemperature_MidDH_freeboost:
  fix_foreign_investments:
    reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  sector:
    heat_pump_sources:
      urban central: *hps_without_ptes
    district_heating:
      potential:
        DE: 0.4
      ptes:
        discharge_resistive_boosting: false
        top_temperature: "forward"
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05

# NOTE: paper "freecap" and "freeboost_freescale" variants collapsed onto
# rhboost / freeboost respectively because `temperature_dependent_capacity`
# is already false by default on this branch (no capacity scaling).

